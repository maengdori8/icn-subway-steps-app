name: icn_subway_app
description: "ICN Subway Steps: 인천공항 T1 입국장에서 서울역행 공항철도 탑승까지 단계별 사진 안내(9장 화면 구현)"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.5

# 수업 기준은 Flutter SDK만 쓰는 것이다. 아래 직접 의존성은 이유가 있어 추가했다(reports/package-check.csv).
# - flutter_localizations(SDK): 한국어 Material 위젯 문구(뒤로 가기 툴팁, 텍스트 선택 메뉴)
# - shared_preferences: 경로별 진행·테마·언어 기억(요청 사항)
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  shared_preferences: ^2.5.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # 단계 사진(가로 720px로 줄임). 출처·라이선스: assets/photos/CREDITS.md, 앱의 설정(S05) > 사진 출처
  assets:
    - assets/photos/arrivals_t1.jpg
    - assets/photos/express_concourse.jpg
    - assets/photos/local_concourse.jpg
    - assets/photos/local_platform.jpg
